spring.application.name=SSSMS-Academic-Portal

# Use Render's PORT if available, otherwise default to 8080
server.port=${PORT:8080}

# Trust and forward headers from Nginx reverse proxy (X-Forwarded-For, X-Forwarded-Proto, etc.)
# Required so Spring Boot correctly resolves HTTPS scheme and real client IPs behind Nginx.
server.forward-headers-strategy=native

# Database: Use Env Var (Prod) OR Default to Local Docker (Dev)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Add Dialect to be safe on Aiven
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Uploads: Base directory — driven by UPLOAD_DIR env var (container: /uploads, local dev: ./uploads)
file.upload-dir=${UPLOAD_DIR:/uploads}
# Subdirectory for user profile photos (students & faculty)
file.upload-dir.profiles=${file.upload-dir}/profile_pictures
# Subdirectory for academic resources (PDFs, timetables, schedules, notices)
file.upload-dir.resources=${file.upload-dir}/resources
# NOTE: client_max_body_size in nginx.conf must be >= these values (currently 10MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Log Purge Settings
# Low-value logs (DATA_VIEWED, UNKNOWN) are deleted after this many days
logging.purge.low-value-retention-days=${LOG_LOW_VALUE_RETENTION_DAYS:7}
# Important audit logs (LOGIN, ERROR, enrollments, etc.) are deleted after this many days
logging.purge.high-value-retention-days=${LOG_HIGH_VALUE_RETENTION_DAYS:90}
# Cron expression for when the purge runs (default: daily at 2 AM)
logging.purge.cron=${LOG_PURGE_CRON:0 0 2 * * *}
