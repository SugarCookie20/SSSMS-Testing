services:
  # 1. MySQL Database
  sssms-db:
    image: mysql:8.0
    container_name: sssms_testing_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  # 2. Backend (Spring Boot 4 / Java 25)
  backend:
    build: ./backend
    container_name: sssms_testing_backend
    ports:
      - "8080:8080"
    depends_on:
      sssms-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://sssms-db:3306/sssms_portal_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - ./uploads_data:/uploads

  # 3. Frontend (React)
  frontend:
    build: ./frontend
    container_name: sssms_testing_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  # 4. Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: sssms_testing_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend